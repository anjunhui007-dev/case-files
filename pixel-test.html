<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>픽셀 전투 테스트</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui;padding:12px;touch-action:none}h2{font-size:18px}canvas{width:100%;max-width:700px;background:#263247;border:2px solid #718096;border-radius:10px;image-rendering:pixelated}.c{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{padding:14px 18px;background:#334155;color:#fff;border:1px solid #64748b;border-radius:10px;font-weight:700}</style></head><body><h2>⚔ 픽셀 전투 테스트</h2><canvas id="c" width="640" height="360"></canvas><div class="c"><button id="l">◀ 이동</button><button id="r">이동 ▶</button><button id="a">⚔ 공격</button><button id="f">🔥 화염구</button><button id="reset">↻ 부활</button></div><script>const c=document.querySelector('#c'),g=c.getContext('2d');let x=140,ex=480,hp=100,dir=1,fire=[],swing=0,L=0,R=0;function q(a,b,w,h,z){g.fillStyle=z;g.fillRect(a,b,w,h)}function man(a,b,enemy){q(a-9,b-35,18,18,enemy?'#c87968':'#e5ad78');q(a-11,b-17,22,27,enemy?'#9b4654':'#4f7dcc');q(a-9,b+10,7,20,enemy?'#743642':'#35578e');q(a+3,b+10,7,20,enemy?'#743642':'#35578e');q(a-11,b-39,22,6,enemy?'#522a31':'#302725')}function draw(){q(0,0,640,360,'#202b3c');for(let y=50;y<290;y+=30)for(let z=0;z<640;z+=48)q(z+(y%60?0:24),y,44,25,'#2c394e');q(0,295,640,65,'#3a4655');man(x,265,0);if(hp>0)man(ex,265,1);if(swing){g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();g.moveTo(x+dir*10,255);g.lineTo(x+dir*48,235+swing);g.stroke()}fire.forEach(p=>{q(p.x-8,p.y-8,16,16,'#ff7138');q(p.x-4,p.y-4,8,8,'#ffd45a')});q(410,20,200,12,'#311f27');q(410,20,200*hp/100,12,'#d45564');g.fillStyle='#fff';g.font='14px monospace';g.fillText('ENEMY '+hp+'/100',410,16);if(!hp){g.font='bold 28px monospace';g.fillText('VICTORY!',250,175)}}function loop(){if(L){x-=3;dir=-1}if(R){x+=3;dir=1}x=Math.max(30,Math.min(610,x));if(swing)swing--;fire.forEach(p=>{p.x+=p.v;if(Math.abs(p.x-ex)<18&&hp){hp=Math.max(0,hp-20);p.dead=1}});fire=fire.filter(p=>!p.dead&&p.x>0&&p.x<640);draw();requestAnimationFrame(loop)}function hold(id,k){let b=document.querySelector(id);b.onpointerdown=e=>{e.preventDefault();k(1)};b.onpointerup=b.onpointercancel=b.onpointerleave=e=>k(0)}hold('#l',v=>L=v);hold('#r',v=>R=v);document.querySelector('#a').onclick=()=>{swing=12;if(Math.abs(x-ex)<90)hp=Math.max(0,hp-15)};document.querySelector('#f').onclick=()=>fire.push({x:x+dir*20,y:250,v:dir*6});document.querySelector('#reset').onclick=()=>hp=100;draw();loop()</script></body></html>
