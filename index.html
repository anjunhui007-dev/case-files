<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0c0b"><title>Chronicle TRPG</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=4"></head><body><div id="app"><header class="top"><button class="icon" id="mapBtn">⌖</button><div class="world-head"><b>CHRONICLE</b><small><span id="dayText">Day 1 · 낮</span><i></i><span id="location">왕도 · 모험가 길드</span></small><div class="present-bar"><span>WITH</span><div id="presentFaces"></div></div></div><button class="icon" id="menuBtn">☰</button></header><main id="chat"><section class="scene"><div class="scene-ornament">✦</div><div class="scene-copy"><small>NEW CHRONICLE</small><h1>이야기를 시작하세요</h1><p>무엇이든 자유롭게 행동하세요.<br>당신의 선택이 이 세계의 기록이 됩니다.</p></div></section><div id="messages"></div></main><div id="choiceRail" class="choice-rail" hidden></div><section class="survival-hud"><div class="vital"><span class="vital-label">HP</span><div class="vital-track"><i id="hpBar"></i></div><b id="hpText">100 / 100</b></div><div class="vital"><span class="vital-label">ST</span><div class="vital-track stamina"><i id="staminaBar"></i></div><b id="staminaText">100 / 100</b></div><div id="conditionPill" class="condition-pill normal">정상</div></section><div class="quick"><button id="statusBtn"><em>◆</em> 스탯 · 정수</button><button id="skipBtn"><em>»</em> 건너뛰기</button><button id="sleepBtn"><em>☾</em> 잠들기</button><button id="quickMapBtn"><em>⌖</em> 지도</button></div><form id="composer"><textarea id="input" rows="1" placeholder="당신은 무엇을 하는가?"></textarea><button id="send" type="submit">➤</button></form><nav><button class="active" data-t
