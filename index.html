<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120f"><title>Chronicle TRPG</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header class="top"><button class="icon" id="mapBtn">🗺️</button><div><b>CHRONICLE</b><small id="location">왕도 · 모험가 길드</small></div><button class="icon" id="menuBtn">☰</button></header><main id="chat"><section class="scene"><div class="scene-mark">✦</div><div><small>새로운 모험</small><h1>이야기를 시작하세요</h1><p>자유롭게 행동을 입력하면 세계가 그 선택에 반응합니다.</p></div></section><div id="messages"></div></main><div class="quick"><button data-action="주변을 자세히 살펴본다">👁 탐색</button><button data-action="현재 상태를 확인한다">♟ 상태</button><button data-action="인벤토리를 확인한다">🎒 가방</button><button data-action="지도를 펼쳐본다">⌖ 지도</button></div><form id="composer"><textarea id="input" rows="1" placeholder="무엇을 할까?"></textarea><button id="send" type="submit">➤</button></form><nav><button class="active" data-tab="chat">💬<span>모험</span></button><button data-tab="character">♟<span>캐릭터</span></button><button data-tab="inventory">◇<span>소지품</span></button><button data-tab="memory">✦<span>기억</span></button></nav></div><dialog id="panel"><button class="close">×</button><div id="panelContent"></div></dialog><script src="app.js"></script></body></html>
