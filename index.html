<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15120f"><title>Chronicle TRPG</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header class="top"><button class="icon" id="mapBtn">🗺️</button><div class="world-head"><b>CHRONICLE</b><small><span id="dayText">Day 1 · 낮</span>　<span id="location">왕도 · 모험가 길드</span></small><div id="presentBar" class="present-bar"><span>함께 있음</span><div id="presentFaces"></div></div></div><button class="icon" id="menuBtn">☰</button></header><main id="chat"><section class="scene"><div class="scene-mark">✦</div><div><small>새로운 모험</small><h1>이야기를 시작하세요</h1><p>자유롭게 행동하세요. 필요할 때 GM이 추천 행동도 제시할 수 있습니다.</p></div></section><div id="messages"></div></main><div id="choiceRail" class="choice-rail" hidden></div><div class="quick"><button data-action="주변을 자세히 살펴본다">👁 탐색</button><button id="talkBtn">💬 대화</button><button id="skipBtn">⏭ 건너뛰기</button><button id="sleepBtn">🛏 잠들기</button><button id="quickMapBtn">⌖ 지도</button></div><form id="composer"><textarea id="input" rows="1" placeholder="무엇을 할까?"></textarea><button id="send" type="submit">➤</button></form><nav><button class="active" data-tab="chat">💬<span>모험</span></button><button data-tab="character">♟<span>캐릭터</span></button><button data-tab="inventory">◇<span>소지품</span></button><button data-tab="memory">✦<span>기억</span></button></nav></div><dialog id="panel"><button class="close">×</button><div id="panelContent"></div></dialog><input id="portraitInput" type="file" accept="image/*" hidden><input id="backupInput" type="file" accept="application/json,.json" hidden><script src="app.js"></script></body></html>
